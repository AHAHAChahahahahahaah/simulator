<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Паркур</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        #loader-screen {
            position: fixed; inset: 0; background: #111;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.6s ease;
        }
        #loader-screen .spinner {
            width: 48px; height: 48px;
            border: 5px solid #333; border-top-color: #4CAF50;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loader-screen p {
            color: #aaa; font-family: sans-serif; font-size: 13px;
            text-transform: uppercase; letter-spacing: 2px; margin: 0 0 16px;
        }
        #loader-track {
            width: 200px; height: 4px; background: #333; border-radius: 2px; overflow: hidden;
        }
        #loader-bar {
            height: 100%; width: 0%; background: #4CAF50;
            transition: width 0.2s ease; border-radius: 2px;
        }
        #loader-pct {
            color: #4CAF50; font-family: sans-serif; font-size: 12px;
            margin-top: 8px; letter-spacing: 1px;
        }
        #apple-counter {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.45); border: 2px solid rgba(255,255,255,0.5);
            border-radius: 20px; padding: 6px 18px;
            color: white; font-family: sans-serif; font-size: 18px; font-weight: 700;
            z-index: 20; backdrop-filter: blur(4px);
            display: flex; align-items: center; gap: 8px;
        }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; z-index: 20; }
        #jump-button {
            position: absolute; bottom: 60px; right: 40px; width: 70px; height: 70px;
            background: rgba(255, 255, 255, 0.3); border: 2px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white;
            font-family: sans-serif; user-select: none; z-index: 20;
        }
    </style>
</head>
<body>
    <div id="loader-screen">
        <div class="spinner"></div>
        <p>Загрузка</p>
        <div id="loader-track"><div id="loader-bar"></div></div>
        <div id="loader-pct">0%</div>
    </div>

    <div id="apple-counter">🍎 <span id="apple-count">0 / 20</span></div>
    <div id="joystick-zone"></div>
    <div id="jump-button"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script type="module" src="./js/game.js?v=4"></script>
</body>
</html>
